<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WORD SALAD — Head to Head</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root {
  --blue:   #003DA5;
  --orange: #FF6600;
  --yellow: #FFD700;
  --green:  #4ade80;
  --red:    #f87171;
  --dark:   #0a0a0f;
  --dark2:  #12121a;
  --dark3:  #1a1a2e;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{
  background:var(--dark); color:#fff;
  font-family:'Barlow',sans-serif;
  min-height:100vh; overflow-x:hidden; user-select:none;
  background-image:
    radial-gradient(ellipse at 15% 0%,   rgba(0,61,165,0.28) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(255,102,0,0.18) 0%, transparent 55%);
}

/* ── SPLASH ─────────────────────────────────────────────── */
#splash{
  position:fixed; inset:0; z-index:200;
  background:var(--dark); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px; padding:24px;
}
#splash-title{
  font-family:'Bebas Neue',sans-serif; font-size:clamp(48px,14vw,72px);
  letter-spacing:6px; color:var(--orange);
  text-shadow:0 0 40px rgba(255,102,0,0.6);
  opacity:0; transform:translateY(20px);
  transition:opacity .6s ease, transform .6s ease;
}
#splash-sub{
  font-family:'Barlow Condensed',sans-serif; font-size:13px;
  font-weight:700; letter-spacing:4px; color:rgba(255,255,255,0.3);
  text-transform:uppercase; opacity:0; transition:opacity .6s ease .3s;
}
#splash-wheel{
  width:140px; height:140px; opacity:0;
  transition:opacity .5s ease .1s;
}
#splash.out{ opacity:0; transition:opacity .5s; pointer-events:none; }

/* ── LOBBY ──────────────────────────────────────────────── */
#lobby{
  display:none; flex-direction:column; align-items:center;
  min-height:100vh; padding:32px 20px 40px;
  max-width:420px; margin:0 auto; gap:0;
}
.lobby-logo-row{
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:6px;
}
#lobby-title{
  font-family:'Bebas Neue',sans-serif; font-size:44px; letter-spacing:5px;
  color:var(--orange); text-shadow:0 0 24px rgba(255,102,0,0.5);
  margin-bottom:2px;
}
#lobby-sub{
  font-family:'Barlow Condensed',sans-serif; font-size:11px;
  font-weight:700; letter-spacing:4px; color:rgba(255,255,255,0.3);
  text-transform:uppercase; margin-bottom:28px;
}
.field-block{ width:100%; margin-bottom:14px; }
.field-label{
  font-family:'Barlow Condensed',sans-serif; font-size:11px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.35);
  text-transform:uppercase; margin-bottom:6px; display:block;
}
.field-input{
  width:100%; background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:12px; color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px; font-weight:600; letter-spacing:1px;
  padding:13px 16px; outline:none;
  transition:border-color .2s;
}
.field-input:focus{ border-color:var(--orange); }
.field-input::placeholder{ color:rgba(255,255,255,0.2); }
.big-btn{
  width:100%; padding:15px; border:none; border-radius:14px;
  font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
  cursor:pointer; transition:all .15s; margin-bottom:10px;
}
.big-btn.orange{ background:var(--orange); color:#fff; box-shadow:0 4px 24px rgba(255,102,0,0.35); }
.big-btn.orange:hover{ background:#ff7722; transform:translateY(-1px); }
.big-btn.ghost{
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.6);
}
.big-btn.ghost:hover{ border-color:var(--orange); color:var(--orange); }
.divider{
  width:100%; display:flex; align-items:center; gap:12px; margin:8px 0 16px;
}
.divider-line{ flex:1; height:1px; background:rgba(255,255,255,0.08); }
.divider-txt{
  font-family:'Barlow Condensed',sans-serif; font-size:11px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.2);
}
.join-row{ display:flex; gap:8px; width:100%; }
.join-row .field-input{ flex:1; }
.join-btn{
  padding:0 20px; background:rgba(255,102,0,0.15);
  border:1.5px solid var(--orange); border-radius:12px;
  color:var(--orange); font-family:'Bebas Neue',sans-serif;
  font-size:18px; letter-spacing:2px; cursor:pointer; white-space:nowrap;
  transition:all .15s;
}
.join-btn:hover{ background:var(--orange); color:#fff; }
#lobby-msg{
  font-family:'Barlow Condensed',sans-serif; font-size:13px;
  font-weight:700; letter-spacing:1px; color:var(--orange);
  text-align:center; min-height:18px; margin-top:4px;
}

/* ── WAITING ────────────────────────────────────────────── */
#waiting{
  display:none; flex-direction:column; align-items:center;
  min-height:100vh; padding:48px 20px; max-width:420px;
  margin:0 auto; gap:20px;
}
#waiting-title{
  font-family:'Bebas Neue',sans-serif; font-size:32px;
  letter-spacing:4px; color:rgba(255,255,255,0.4);
}
#waiting-code{
  font-family:'Bebas Neue',sans-serif; font-size:64px;
  letter-spacing:12px; color:var(--orange);
  text-shadow:0 0 40px rgba(255,102,0,0.4);
}
#waiting-hint{
  font-family:'Barlow Condensed',sans-serif; font-size:12px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.25);
  text-transform:uppercase; text-align:center;
}
.share-btn{
  width:100%; max-width:320px; padding:15px;
  background:#ff6b9d; border:none; border-radius:14px;
  font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px;
  color:#fff; cursor:pointer;
  animation:pulse-pink 1.8s ease-in-out infinite;
}
@keyframes pulse-pink{
  0%,100%{ box-shadow:0 0 0 0 rgba(255,107,157,0.5); }
  50%{     box-shadow:0 0 0 14px rgba(255,107,157,0); }
}
.share-btn:active{ transform:scale(0.97); }
.waiting-dots{ display:flex; gap:8px; align-items:center; }
.dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--orange); opacity:0.3;
  animation:dot-pulse 1.4s ease-in-out infinite;
}
.dot:nth-child(2){ animation-delay:.2s; }
.dot:nth-child(3){ animation-delay:.4s; }
@keyframes dot-pulse{ 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }

/* ── GAME SCREEN ────────────────────────────────────────── */
#game{
  display:none; flex-direction:column; align-items:center;
  min-height:100vh; padding:12px 16px 0;
  max-width:480px; margin:0 auto;
}

/* top bar */
.game-topbar{
  width:100%; display:flex; align-items:center;
  justify-content:space-between; margin-bottom:10px;
}
.topbar-stat{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.topbar-label{
  font-family:'Barlow Condensed',sans-serif; font-size:9px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.3);
  text-transform:uppercase;
}
.topbar-val{
  font-family:'Bebas Neue',sans-serif; font-size:28px;
  color:#fff; letter-spacing:1px; line-height:1;
}

/* timer ring */
.timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.timer-ring{ position:relative; width:72px; height:72px; }
.timer-ring svg{ transform:rotate(-90deg); display:block; }
.timer-num{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1;
}
/* burn bar */
#burn-bar-track{
  width:100%; height:5px; background:rgba(255,255,255,0.07);
  border-radius:3px; overflow:hidden; margin-bottom:8px;
}
#burn-bar{
  height:100%; border-radius:3px; width:100%;
  transition:width 1s linear, background-color .4s;
}

/* turn banner */
#turn-banner{
  width:100%; padding:9px 16px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  gap:8px; margin-bottom:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:all .3s;
}
#turn-banner.my-turn{
  background:rgba(255,102,0,0.12);
  border-color:rgba(255,102,0,0.3);
}
#turn-txt{
  font-family:'Barlow Condensed',sans-serif; font-size:16px;
  font-weight:700; letter-spacing:2px; color:rgba(255,255,255,0.4);
  text-transform:uppercase;
}
#turn-banner.my-turn #turn-txt{ color:var(--orange); }

/* wheel */
.wheel-card{
  width:100%; background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:20px; padding:16px 12px 12px;
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:10px;
}
#wheel-svg{ width:220px; height:220px; }
#game-msg{
  font-family:'Barlow Condensed',sans-serif; font-size:14px;
  font-weight:700; letter-spacing:2px; min-height:18px;
  margin-top:8px; text-align:center; text-transform:uppercase;
}
.msg-ok{    color:var(--green);  }
.msg-error{ color:var(--red);    }
.msg-info{  color:var(--yellow); }
.msg-check{ color:rgba(255,255,255,0.4); }

/* word history */
.history-card{
  width:100%; background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:14px; padding:10px 14px; margin-bottom:10px;
}
.history-label{
  font-family:'Barlow Condensed',sans-serif; font-size:9px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.25);
  text-transform:uppercase; margin-bottom:6px;
}
.history-pills{ display:flex; flex-wrap:wrap; gap:5px; min-height:22px; }
.pill{
  font-family:'Barlow Condensed',sans-serif; font-size:12px;
  font-weight:700; letter-spacing:1px; padding:3px 10px;
  border-radius:20px; text-transform:uppercase;
}
.pill-ok{   background:rgba(74,222,128,0.12); color:var(--green); border:1px solid rgba(74,222,128,0.25); }
.pill-bad{  background:rgba(248,113,113,0.1); color:var(--red);   border:1px solid rgba(248,113,113,0.2); text-decoration:line-through; }

/* ── KEYBOARD ───────────────────────────────────────────── */
#keyboard{
  display:none; position:sticky; bottom:0;
  width:100%; max-width:480px;
  background:rgba(10,10,15,0.97);
  border-top:1px solid rgba(255,102,0,0.15);
  padding:10px 12px 20px;
  backdrop-filter:blur(12px);
}
/* word build strip */
.kb-strip-row{
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
#word-strip{
  flex:1; min-height:50px; background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.1); border-radius:12px;
  display:flex; align-items:center; gap:4px;
  padding:4px 8px; flex-wrap:wrap;
}
.strip-placeholder{
  font-family:'Barlow Condensed',sans-serif; font-size:12px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.15);
  text-transform:uppercase;
}
.wtile{
  width:36px; height:40px; border-radius:8px;
  background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.18);
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:22px; color:#fff;
}
.wtile.centre{ border-color:var(--green); color:var(--green); background:rgba(74,222,128,0.08); }

/* del / enter */
.kb-actions{ display:flex; flex-direction:column; gap:5px; }
.kb-del{
  background:rgba(248,113,113,0.1); border:1.5px solid rgba(248,113,113,0.25);
  border-radius:10px; color:var(--red);
  font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px;
  padding:6px 10px; cursor:pointer; white-space:nowrap;
}
.kb-del:active{ transform:scale(0.94); }
.kb-enter{
  background:var(--orange); border:none; border-radius:10px; color:#fff;
  font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px;
  padding:6px 10px; cursor:pointer; white-space:nowrap;
  box-shadow:0 2px 12px rgba(255,102,0,0.3);
}
.kb-enter:active{ transform:scale(0.94); }
.kb-enter:disabled{ background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.2); box-shadow:none; }

/* key tiles */
.kb-row{ display:flex; justify-content:center; gap:7px; margin-bottom:7px; }
.kb-key{
  height:54px; min-width:46px; flex:1; max-width:54px;
  background:rgba(255,255,255,0.06);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:10px; color:#fff;
  font-family:'Bebas Neue',sans-serif; font-size:24px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .1s; user-select:none;
}
.kb-key:active{ transform:scale(0.9); background:rgba(255,102,0,0.2); border-color:var(--orange); }
.kb-key.centre-key{
  background:rgba(74,222,128,0.1);
  border-color:rgba(74,222,128,0.4); color:var(--green);
}
.kb-key.centre-key:active{ background:rgba(74,222,128,0.25); }
.kb-key.locked{ opacity:0.25; pointer-events:none; }

/* ── RESULT ─────────────────────────────────────────────── */
#result{
  display:none; flex-direction:column; align-items:center;
  min-height:100vh; padding:48px 20px 40px;
  max-width:420px; margin:0 auto; gap:16px;
}
#result-icon{ font-size:64px; }
#result-title{
  font-family:'Bebas Neue',sans-serif; font-size:56px;
  letter-spacing:4px; text-align:center; line-height:1;
}
.result-win{  color:var(--orange); text-shadow:0 0 40px rgba(255,102,0,0.5); }
.result-lose{ color:var(--red);    text-shadow:0 0 40px rgba(248,113,113,0.4); }
#result-detail{
  font-family:'Barlow Condensed',sans-serif; font-size:15px;
  font-weight:600; color:rgba(255,255,255,0.45); text-align:center;
  letter-spacing:1px; line-height:1.6;
}
.result-words{
  width:100%; background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07); border-radius:14px;
  padding:12px 14px;
}
.result-words-label{
  font-family:'Barlow Condensed',sans-serif; font-size:9px;
  font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.25);
  text-transform:uppercase; margin-bottom:8px;
}

/* fireworks */
#fw-canvas{
  position:fixed; inset:0; z-index:300;
  pointer-events:none; display:none;
}

/* ── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeUp{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
@keyframes pop{ 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
@keyframes burn{ 0%,100%{opacity:1} 50%{opacity:.65} }
.shake{ animation:shake .3s ease; }
.pop{ animation:pop .15s ease; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <svg id="splash-wheel" viewBox="0 0 240 240"></svg>
  <div id="splash-title">WORD SALAD</div>
  <div id="splash-sub">Head to Head · Real Time</div>
</div>

<!-- LOBBY -->
<div id="lobby">
  <div class="lobby-logo-row">
    <div id="lobby-title">WORD SALAD</div>
    <div id="lobby-sub">Head to Head · Real Time</div>
  </div>
  <div class="field-block">
    <span class="field-label">Your name</span>
    <input id="player-name" class="field-input" type="text" placeholder="Enter your name" maxlength="16"/>
  </div>
  <button class="big-btn orange" onclick="createRoom()">CREATE ROOM</button>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-txt">OR JOIN</div>
    <div class="divider-line"></div>
  </div>
  <div class="join-row">
    <input id="join-code" class="field-input" type="text" placeholder="Room code" maxlength="6" style="text-transform:uppercase;letter-spacing:4px"/>
    <button class="join-btn" onclick="joinRoom()">JOIN</button>
  </div>
  <div id="lobby-msg"></div>
</div>

<!-- WAITING -->
<div id="waiting">
  <div id="waiting-title">ROOM CODE</div>
  <div id="waiting-code">——</div>
  <div class="waiting-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div id="waiting-hint">Share this code with your opponent</div>
  <button class="share-btn" onclick="shareRoom()">📣 &nbsp;SHARE ROOM CODE</button>
</div>

<!-- GAME -->
<div id="game">
  <!-- burn bar -->
  <div id="burn-bar-track" style="width:100%"><div id="burn-bar"></div></div>

  <!-- top bar -->
  <div class="game-topbar">
    <div class="topbar-stat">
      <span class="topbar-label">Round</span>
      <span class="topbar-val" id="round-num">1</span>
    </div>
    <div class="timer-wrap">
      <div class="timer-ring">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
          <circle id="timer-arc" cx="36" cy="36" r="30" fill="none" stroke="#FFD700" stroke-width="6"
            stroke-dasharray="188.5" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div class="timer-num" id="timer-num" style="color:#FFD700">30</div>
      </div>
    </div>
    <div class="topbar-stat">
      <span class="topbar-label">Words</span>
      <span class="topbar-val" id="used-count">0</span>
    </div>
  </div>

  <!-- turn banner -->
  <div id="turn-banner">
    <div id="turn-txt">Waiting...</div>
  </div>

  <!-- wheel -->
  <div class="wheel-card">
    <svg id="wheel-svg" viewBox="0 0 240 240" width="220" height="220"></svg>
    <div id="game-msg"></div>
  </div>

  <!-- history -->
  <div class="history-card">
    <div class="history-label">Words Played</div>
    <div class="history-pills" id="word-history"></div>
  </div>
</div>

<!-- KEYBOARD -->
<div id="keyboard">
  <div class="kb-strip-row">
    <div id="word-strip">
      <span class="strip-placeholder">TAP LETTERS BELOW</span>
    </div>
    <div class="kb-actions">
      <button class="kb-del" id="kb-del-btn" onclick="deleteLetter()">⌫ DEL</button>
      <button class="kb-enter" id="kb-enter-btn" onclick="submitWord()" disabled>ENTER</button>
    </div>
  </div>
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2"></div>
</div>

<!-- RESULT -->
<div id="result">
  <div id="result-icon">🏆</div>
  <div id="result-title" class="result-win">YOU WIN!</div>
  <div id="result-detail"></div>
  <div class="result-words">
    <div class="result-words-label">Words Played</div>
    <div class="history-pills" id="result-history"></div>
  </div>
  <button class="share-btn" id="result-share-btn" onclick="shareResult()" style="margin-top:4px">🎉 &nbsp;CHALLENGE A FRIEND</button>
  <button class="big-btn ghost" onclick="resetGame()" style="max-width:320px;width:100%">PLAY AGAIN</button>
</div>

<canvas id="fw-canvas"></canvas>

<script>
// ── FIREBASE ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAJWQFKLGBHS77ZNrRm5EmfpaBIYb_hLmw",
  authDomain: "wordsalad-b1a9c.firebaseapp.com",
  databaseURL: "https://wordsalad-b1a9c-default-rtdb.firebaseio.com",
  projectId: "wordsalad-b1a9c",
  storageBucket: "wordsalad-b1a9c.firebasestorage.app",
  messagingSenderId: "185162364608",
  appId: "1:185162364608:web:a1b5bd1859d19ef81a1f25"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── WHEEL DATA ────────────────────────────────────────────
const OUTER  = ['C','G','R','H','L','O','T','I','T'];
const CENTRE = 'H';
const POOL   = [...OUTER, CENTRE];
const TURNS  = 30;

// ── STATE ─────────────────────────────────────────────────
let myId='', myName='', mySlot=null;
let roomId=null, roomRef=null;
let gameState=null, isMyTurn=false;
let currentWord=[], isSubmitting=false;
let timerInterval=null, timeLeft=TURNS;
let listenersActive=false, kbBuilt=false;

// ── DRAW WHEEL ────────────────────────────────────────────
function drawWheel(svgId, small){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  const cx=120,cy=120, oR=small?108:115, iR=small?50:55, n=OUTER.length;
  let html='';
  for(let i=0;i<n;i++){
    const a1=(i/n)*Math.PI*2-Math.PI/2, a2=((i+1)/n)*Math.PI*2-Math.PI/2, m=(a1+a2)/2;
    const x1=cx+oR*Math.cos(a1),y1=cy+oR*Math.sin(a1);
    const x2=cx+oR*Math.cos(a2),y2=cy+oR*Math.sin(a2);
    const x3=cx+iR*Math.cos(a2),y3=cy+iR*Math.sin(a2);
    const x4=cx+iR*Math.cos(a1),y4=cy+iR*Math.sin(a1);
    const tx=cx+((oR+iR)/2)*Math.cos(m), ty=cy+((oR+iR)/2)*Math.sin(m)+1;
    html+=`<path d="M${x1},${y1} A${oR},${oR} 0 0,1 ${x2},${y2} L${x3},${y3} A${iR},${iR} 0 0,0 ${x4},${y4} Z"
      fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>`;
    html+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"
      fill="#fff" font-family="Bebas Neue,sans-serif" font-size="${small?17:20}" opacity="0.9">${OUTER[i]}</text>`;
  }
  const cFill='rgba(255,102,0,0.12)', cStroke='rgba(255,102,0,0.6)';
  html+=`<circle cx="${cx}" cy="${cy}" r="${iR-4}" fill="${cFill}" stroke="${cStroke}" stroke-width="2.5"/>`;
  html+=`<text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle"
    fill="var(--orange)" font-family="Bebas Neue,sans-serif" font-size="${small?28:34}" opacity="1">${CENTRE}</text>`;
  svg.innerHTML = html;
}

// ── SPLASH ────────────────────────────────────────────────
window.addEventListener('load', ()=>{
  drawWheel('splash-wheel', true);
  const sp = document.getElementById('splash');
  const title = document.getElementById('splash-title');
  const sub   = document.getElementById('splash-sub');
  const wh    = document.getElementById('splash-wheel');
  setTimeout(()=>{ wh.style.opacity='1'; title.style.opacity='1'; title.style.transform='none'; },100);
  setTimeout(()=>{ sub.style.opacity='1'; },400);
  setTimeout(()=>{
    sp.classList.add('out');
    setTimeout(()=>{ sp.style.display='none'; showScreen('lobby'); },500);
  }, 2000);
});

function showScreen(id){
  ['lobby','waiting','game','result'].forEach(s=>{
    const el=document.getElementById(s);
    if(el){ el.style.display = s===id ? 'flex' : 'none'; }
  });
  const kb = document.getElementById('keyboard');
  if(kb) kb.style.display = id==='game' ? 'block' : 'none';
}

// ── FIREBASE ROOM ─────────────────────────────────────────
function uid()  { return Math.random().toString(36).slice(2,9).toUpperCase(); }
function mkRoom(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function setLobbyMsg(m){ const e=document.getElementById('lobby-msg'); if(e)e.textContent=m; }

async function createRoom(){
  const n=document.getElementById('player-name').value.trim();
  if(!n){setLobbyMsg('Enter your name first');return;}
  myName=n; myId=uid(); mySlot='p1'; roomId=mkRoom();
  setLobbyMsg('Creating room...');
  roomRef=db.ref('rooms/'+roomId);
  await roomRef.set({
    created:Date.now(), p1:{id:myId,name:myName}, p2:null,
    status:'waiting', round:1, currentTurn:'p1',
    firstRound:true, p1FailedFirst:false, words:[], loser:null
  });
  document.getElementById('waiting-code').textContent=roomId;
  showScreen('waiting');
  listenRoom();
}

async function joinRoom(){
  const n=document.getElementById('player-name').value.trim();
  const c=document.getElementById('join-code').value.trim().toUpperCase();
  if(!n){setLobbyMsg('Enter your name first');return;}
  if(!c||c.length<4){setLobbyMsg('Enter a room code');return;}
  myName=n; myId=uid(); mySlot='p2'; roomId=c;
  setLobbyMsg('Joining...');
  roomRef=db.ref('rooms/'+roomId);
  const snap=await roomRef.once('value');
  if(!snap.exists()){setLobbyMsg('Room not found.');return;}
  if(snap.val().p2){setLobbyMsg('Room is full.');return;}
  await roomRef.update({p2:{id:myId,name:myName},status:'playing'});
  document.getElementById('waiting-code').textContent=roomId;
  showScreen('waiting');
  listenRoom();
}

function listenRoom(){
  if(listenersActive)return;
  listenersActive=true;
  roomRef.on('value',snap=>{
    if(!snap.exists())return;
    const d=snap.val(); gameState=d;
    if(d.status==='playing'&&document.getElementById('waiting').style.display==='flex'){
      showScreen('game');
      drawWheel('wheel-svg',false);
      buildKeyboard();
    }
    if(d.status==='playing')  updateGameUI(d);
    if(d.status==='finished') endGame(d);
  });
}

// ── GAME UI ───────────────────────────────────────────────
function updateGameUI(d){
  const rn=document.getElementById('round-num');
  const uc=document.getElementById('used-count');
  if(rn) rn.textContent=d.round||1;
  const words=d.words||[];
  if(uc) uc.textContent=words.filter(w=>w.valid).length;
  renderHistory(words);
  isMyTurn=(d.currentTurn===mySlot);
  const p1=d.p1?.name||'P1', p2=d.p2?.name||'P2';
  const curName=d.currentTurn==='p1'?p1:p2;
  const banner=document.getElementById('turn-banner');
  const txt=document.getElementById('turn-txt');
  if(isMyTurn){
    banner.classList.add('my-turn');
    txt.textContent='YOUR TURN';
    currentWord=[]; renderStrip();
    setKeysLocked(false);
    startTimer();
  } else {
    banner.classList.remove('my-turn');
    txt.textContent=`${curName}'S TURN`;
    setKeysLocked(true);
    stopTimer(); resetTimer();
  }
}

function renderHistory(words){
  const el=document.getElementById('word-history');
  if(!el)return;
  el.innerHTML='';
  [...words].reverse().forEach(w=>{
    const p=document.createElement('span');
    p.className='pill '+(w.valid?'pill-ok':'pill-bad');
    p.textContent=w.word;
    el.appendChild(p);
  });
}

// ── TIMER ─────────────────────────────────────────────────
function startTimer(){
  stopTimer(); timeLeft=TURNS; applyTimer(TURNS);
  timerInterval=setInterval(()=>{
    timeLeft--; applyTimer(timeLeft);
    if(timeLeft<=0){stopTimer();handleTimeout();}
  },1000);
}
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function resetTimer(){ applyTimer(TURNS); }

function applyTimer(t){
  const frac=t/TURNS;
  const burning=t<=10;
  const col = burning ? '#f87171' : t<=20 ? '#ffaa00' : '#FFD700';
  const arc=document.getElementById('timer-arc');
  const num=document.getElementById('timer-num');
  const bar=document.getElementById('burn-bar');
  // 188.5 = 2*pi*30
  if(arc){ arc.setAttribute('stroke-dashoffset',(188.5*(1-frac)).toFixed(2)); arc.setAttribute('stroke',col); }
  if(num){ num.textContent=t; num.style.color=col;
    num.style.animation=burning?'burn .4s ease-in-out infinite':'none'; }
  if(bar){ bar.style.width=(frac*100).toFixed(1)+'%'; bar.style.backgroundColor=col; }
}

async function handleTimeout(){
  if(!isMyTurn)return;
  setMsg('TIME UP!','error');
  await recordFailure('TIMEOUT');
}

// ── KEYBOARD ─────────────────────────────────────────────
function buildKeyboard(){
  if(kbBuilt)return; kbBuilt=true;
  const r1=document.getElementById('kb-row-1');
  const r2=document.getElementById('kb-row-2');
  r1.innerHTML=''; r2.innerHTML='';
  OUTER.slice(0,5).forEach((l,i)=>r1.appendChild(mkKey(l,false,i)));
  OUTER.slice(5).forEach((l,i)=>r2.appendChild(mkKey(l,false,i+5)));
  r2.appendChild(mkKey(CENTRE,true,99));
}
function mkKey(letter,centre,idx){
  const b=document.createElement('button');
  b.className='kb-key'+(centre?' centre-key':'');
  b.textContent=letter; b.id='kk-'+idx;
  b.addEventListener('click',()=>tapLetter(letter,centre));
  return b;
}
function tapLetter(letter,centre){
  if(!isMyTurn||isSubmitting||currentWord.length>=12)return;
  currentWord.push({letter,centre});
  renderStrip();
  document.querySelectorAll('.kb-key').forEach(k=>{
    if(k.textContent===letter){k.classList.add('pop');setTimeout(()=>k.classList.remove('pop'),150);}
  });
}
function deleteLetter(){
  if(!isMyTurn||isSubmitting)return;
  currentWord.pop(); renderStrip();
}
function renderStrip(){
  const s=document.getElementById('word-strip');
  const eb=document.getElementById('kb-enter-btn');
  if(!s)return;
  if(currentWord.length===0){
    s.innerHTML='<span class="strip-placeholder">TAP LETTERS BELOW</span>';
    if(eb)eb.disabled=true; return;
  }
  s.innerHTML='';
  currentWord.forEach(({letter,centre})=>{
    const t=document.createElement('div');
    t.className='wtile'+(centre?' centre':'');
    t.textContent=letter; s.appendChild(t);
  });
  if(eb)eb.disabled=currentWord.length<4;
}
function setKeysLocked(locked){
  document.querySelectorAll('.kb-key').forEach(k=>{
    k.classList.toggle('locked',locked);
  });
  const d=document.getElementById('kb-del-btn');
  if(d){d.style.opacity=locked?'0.25':'1';d.style.pointerEvents=locked?'none':'auto';}
}

// ── DICTIONARY ────────────────────────────────────────────
async function checkDict(word){
  try{
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
    if(!r.ok)return false;
    const d=await r.json();
    return Array.isArray(d)&&d.length>0;
  }catch{return true;}
}
function isPlural(word,used){
  if(!word.endsWith('S'))return false;
  const stem=word.slice(0,-1);
  const vp=used.filter(w=>w.valid).map(w=>w.word);
  if(vp.includes(stem))return true;
  if(stem.endsWith('E')&&vp.includes(stem.slice(0,-1)))return true;
  return false;
}
async function validateWord(word,used){
  if(word.length<4)       return{ok:false,msg:'MUST BE 4+ LETTERS'};
  if(!word.includes(CENTRE))return{ok:false,msg:`MUST INCLUDE '${CENTRE}'`};
  const pool=[...POOL];
  for(const ch of word){const i=pool.indexOf(ch);if(i===-1)return{ok:false,msg:`'${ch}' NOT IN WHEEL`};pool.splice(i,1);}
  const vp=used.filter(w=>w.valid).map(w=>w.word);
  if(vp.includes(word))   return{ok:false,msg:'ALREADY PLAYED'};
  if(isPlural(word,used)) return{ok:false,msg:'NO PLURALS'};
  const ok=await checkDict(word);
  if(!ok)                 return{ok:false,msg:'NOT A VALID WORD'};
  return{ok:true};
}

// ── SUBMIT ────────────────────────────────────────────────
async function submitWord(){
  if(!isMyTurn||currentWord.length<4||isSubmitting)return;
  isSubmitting=true; stopTimer(); setKeysLocked(true);
  const eb=document.getElementById('kb-enter-btn'); if(eb)eb.disabled=true;
  const word=currentWord.map(t=>t.letter).join('');
  currentWord=[]; renderStrip();
  setMsg('CHECKING...','check');
  const v=await validateWord(word,gameState?.words||[]);
  if(!v.ok){
    setMsg(v.msg,'error');
    const wc=document.getElementById('wheel-svg');
    if(wc){wc.classList.add('shake');setTimeout(()=>wc.classList.remove('shake'),350);}
    await recordFailure(word);
  } else {
    setMsg('✓ '+word,'ok');
    await recordSuccess(word);
  }
  isSubmitting=false;
}

function setMsg(txt,type){
  const el=document.getElementById('game-msg');
  if(!el)return;
  el.textContent=txt;
  el.className='msg-'+type;
  if(type!=='check')setTimeout(()=>{el.textContent='';el.className='';},3000);
}

async function recordSuccess(word){
  const words=[...(gameState.words||[]),{word,valid:true,player:myName,slot:mySlot}];
  const next=mySlot==='p1'?'p2':'p1';
  await roomRef.update({words,currentTurn:next,round:(gameState.round||1)+1,firstRound:false});
}
async function recordFailure(word){
  const words=[...(gameState.words||[]),{word,valid:false,player:myName,slot:mySlot}];
  if(gameState.firstRound&&mySlot==='p1'&&!gameState.p1FailedFirst){
    await roomRef.update({words,currentTurn:'p2',p1FailedFirst:true});
    setMsg('P2 GETS A CHANCE','info'); isSubmitting=false; return;
  }
  await roomRef.update({words,status:'finished',loser:mySlot});
}

// ── END GAME ──────────────────────────────────────────────
function endGame(d){
  stopTimer();
  const iWon=d.loser!==mySlot;
  const loserName =d.loser==='p1'?d.p1?.name:d.p2?.name;
  const winnerName=d.loser==='p1'?d.p2?.name:d.p1?.name;
  showScreen('result');
  const icon  =document.getElementById('result-icon');
  const title =document.getElementById('result-title');
  const detail=document.getElementById('result-detail');
  const share =document.getElementById('result-share-btn');
  const rh    =document.getElementById('result-history');
  if(rh){ rh.innerHTML='';
    (d.words||[]).filter(w=>w.valid).forEach(w=>{
      const p=document.createElement('span');
      p.className='pill pill-ok'; p.textContent=w.word; rh.appendChild(p);
    });
  }
  if(iWon){
    icon.textContent='🏆';
    title.textContent='YOU WIN!'; title.className='result-win';
    detail.textContent=`${loserName} couldn't keep up.\nShare and find your next challenger!`;
    share.textContent='🎉  CHALLENGE A FRIEND';
    launchFireworks();
  } else {
    icon.textContent='💀';
    title.textContent='YOU LOSE'; title.className='result-lose';
    detail.textContent=`${winnerName} beat you this time.\nRevenge is one invite away!`;
    share.textContent='😤  INVITE SOMEONE TO BEAT';
  }
}

// ── FIREWORKS ─────────────────────────────────────────────
function launchFireworks(){
  const c=document.getElementById('fw-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.style.display='block';
  c.width=window.innerWidth; c.height=window.innerHeight;
  const parts=[]; const cols=['#FFD700','#FF6600','#4ade80','#f87171','#60a5fa','#fff'];
  function burst(x,y){
    for(let i=0;i<70;i++){
      const a=Math.random()*Math.PI*2,s=2+Math.random()*6;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
        alpha:1,col:cols[Math.floor(Math.random()*cols.length)],
        sz:3+Math.random()*4,g:0.1});
    }
  }
  [[.2,.3],[.8,.25],[.5,.15],[.15,.6],[.85,.55],[.5,.4]]
    .forEach(([rx,ry],i)=>setTimeout(()=>burst(rx*c.width,ry*c.height),i*280));
  let f=0;
  function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.98;p.alpha-=0.014;
      if(p.alpha<=0){parts.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    if(++f<280)requestAnimationFrame(anim);
    else{ctx.clearRect(0,0,c.width,c.height);c.style.display='none';}
  }
  requestAnimationFrame(anim);
}

// ── SHARE ─────────────────────────────────────────────────
function shareRoom(){
  const text=`Join my Word Salad Duel! Room: ${roomId}\n${location.href}`;
  if(navigator.share)navigator.share({title:'Word Salad',text});
  else{navigator.clipboard?.writeText(text);alert('Room code copied: '+roomId);}
}
function shareResult(){
  const text=`I just won a Word Salad Duel! 🏆 Think you can beat me?\n${location.href}`;
  if(navigator.share)navigator.share({title:'Word Salad',text});
  else{navigator.clipboard?.writeText(text);alert('Link copied!');}
}

// ── RESET ─────────────────────────────────────────────────
function resetGame(){
  stopTimer(); listenersActive=false; kbBuilt=false;
  if(roomRef)roomRef.off();
  roomRef=null;roomId=null;mySlot=null;gameState=null;
  currentWord=[];isSubmitting=false;isMyTurn=false;
  const wh=document.getElementById('word-history'); if(wh)wh.innerHTML='';
  const pn=document.getElementById('player-name');  if(pn)pn.value='';
  const jc=document.getElementById('join-code');    if(jc)jc.value='';
  setLobbyMsg('');
  showScreen('lobby');
}
